services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-control-app
    ports:
      - '80:80'
      - '443:443'
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - finance-control-network

networks:
  finance-control-network:
    external: true