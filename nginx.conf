server {
    listen 80;
    server_name finance-control.3utilities.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name finance-control.3utilities.com;

    ssl_certificate /etc/letsencrypt/live/finance-control.3utilities.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finance-control.3utilities.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API
    location /api/ {
        proxy_pass http://finance-control-api:1323/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}